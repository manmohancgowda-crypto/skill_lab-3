
<!DOCTYPE html>
<html>
<head>
    <title>Sports Info</title>
    <link rel="stylesheet" type="text/css" href="task4.css">
</head>
<body>
    <h1 id="heading">Sports Registration Form</h1>

    <form>
        <table>
            <tr>
                <td class="right">Name</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td class="right">Sport</td>
                <td>
                    <select>
                        <option> Cricket </option>
                        <option> Football </option>
                        <option> Basketball </option>
                        <option> Badminton </option>
                    </select>
                </td>
            </tr>

            <tr>
                <td class="right">Category</td>
                <td>
                    <select>
                        <option> Under 15 </option>
                        <option> Under 18 </option>
                        <option> Senior </option>
                    </select>
                </td>
            </tr>

            <tr>
                <td class="right">Upload Photo</td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td class="right">Email ID</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td class="right">Address</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td class="right"></td>
                <td>
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
