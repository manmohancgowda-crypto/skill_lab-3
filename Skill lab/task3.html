
<!DOCTYPE html>
<html>
<body>
<h1>SPORTS ORDER FORM</h1>

<form action = "sports.html">
    <label for = "Buyer">Buyer's Name :</label><br>
    <input type = "text" id = "Buyer"><br>

    <label for = "Address">Address :</label><br>
    <input type = "text" id = "Address"><br>

    <label for = "Phone">Phone Number :</label><br>
    <input type = "text" id = "Phone"><br>

    <h2> SPORTS ITEMS </h2>

    <input type="checkbox" id="Product1" name="Product" value="Cricket Bat">
    <label for="Product1"> CRICKET BAT</label><br>

    <input type="checkbox" id="Product2" name="Product" value="Football">
    <label for="Product2"> FOOTBALL</label><br>

    <input type="checkbox" id="Product3" name="Product" value="Tennis Racket">
    <label for="Product3"> TENNIS RACKET</label><br>

    <input type="checkbox" id="Product4" name="Product" value="Sports Shoes">
    <label for="Product4"> SPORTS SHOES</label><br>

    <input type="checkbox" id="Product5" name="Product" value="Cricket Ball">
    <label for="Product5"> CRICKET BALL</label><br>

    <input type="checkbox" id="Product6" name="Product" value="Badminton Racket">
    <label for="Product6"> BADMINTON RACKET</label><br>

    <input type="checkbox" id="Product7" name="Product" value="Jersey">
    <label for="Product7"> JERSEY</label><br>

    <h3> PAYMENT MODE </h3>

    <input type="radio" id="Cash" name="Payment" value="CASH">
    <label for="Cash">CASH</label><br>

    <input type="radio" id="Online" name="Payment" value="ONLINE">
    <label for="Online">ONLINE</label><br>

    <input type="radio" id="Card" name="Payment" value="CARD">
    <label for="Card">CARD</label><br>

    <input type="submit" value="Submit">
</form>

</body>
</html>
